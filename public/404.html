<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman tidak ditemukan — Absensi Sekolah</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:'Inter',system-ui,sans-serif;color:#0f172a;
    background:radial-gradient(900px 500px at 20% -10%,rgba(99,102,241,.18),transparent 60%),
               radial-gradient(700px 400px at 90% 10%,rgba(6,182,212,.14),transparent 60%),#f1f5f9;
  }
  .box{max-width:420px;text-align:center}
  .code{font-size:6rem;font-weight:900;letter-spacing:-.05em;line-height:1;
        background:linear-gradient(135deg,#4f46e5,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:1.3rem;margin:6px 0 8px}
  p{color:#64748b;font-size:.92rem;line-height:1.65;margin-bottom:22px}
  .links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a{padding:11px 18px;border-radius:12px;font-weight:700;font-size:.88rem;text-decoration:none;transition:transform .15s}
  a:hover{transform:translateY(-1px)}
  .p1{background:#4f46e5;color:#fff;box-shadow:0 10px 24px -8px rgba(79,70,229,.7)}
  .p2{background:#fff;color:#334155;border:1px solid #e2e8f0}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>Halaman tidak ditemukan</h1>
  <p>Tautan yang Anda buka tidak tersedia atau telah dipindahkan. Kembali ke panel administrator atau buka aplikasi absensi.</p>
  <div class="links">
    <a class="p1" href="/admin">Panel Administrator</a>
    <a class="p2" href="/mobile">Aplikasi Absensi</a>
    <a class="p2" href="/kiosk">Kios QR</a>
  </div>
</div>
</body>
</html>
